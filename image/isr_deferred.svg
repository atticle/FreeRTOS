<rect x="320" y="90" width="180" height="95" rx="8" fill="#ffb703" stroke="#333"/><text x="410" y="122" text-anchor="middle" font-family="Arial" font-size="15">RTOS OBJECT</text><text x="410" y="145" text-anchor="middle" font-family="Arial" font-size="12">queue or semaphore</text><text x="410" y="165" text-anchor="middle" font-family="Arial" font-size="12">FromISR API</text>
